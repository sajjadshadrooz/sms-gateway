services:
    postgres:
        image: postgres:17-alpine
        container_name: sms-gateway-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-sms_gateway}
            POSTGRES_USER: ${DB_USERNAME:-sms_gateway}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sms_gateway} -d ${DB_DATABASE:-sms_gateway}"]
            interval: 3s
            timeout: 3s
            retries: 10

    kafka:
        image: apache/kafka:3.9.1
        container_name: sms-gateway-kafka
        restart: unless-stopped
        ports:
            - "${KAFKA_PORT:-9092}:9092"
        volumes:
            - kafka-data:/var/lib/kafka/data
        environment:
            CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
            KAFKA_LOG_DIRS: /var/lib/kafka/data
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093

            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # i make a kafka init in future
            KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-3}
        healthcheck:
            test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
            interval: 5s
            timeout: 10s
            retries: 12
            start_period: 15s

    kafka-ui:
        image: ghcr.io/kafbat/kafka-ui:latest
        container_name: sms-gateway-kafka-ui
        restart: unless-stopped
        ports:
            - "8080:8080"
        environment:
            DYNAMIC_CONFIG_ENABLED: "true"
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
        depends_on:
            - kafka

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: sms-gateway-app
        restart: unless-stopped
        ports:
            - "8000:8000"
        env_file:
            - .env
        environment:
            DB_HOST: postgres
            KAFKA_BROKERS: kafka:29092
        volumes:
            - .:/var/www/html          # live code edits, no rebuild needed
            - /var/www/html/vendor     # keep the image's vendor, not the host one
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy

    sms-express-worker:
        build:
            context: .
            dockerfile: Dockerfile
        command: php artisan kafka:consume-express
        restart: unless-stopped
        init: true
        env_file:
            - .env
        environment:
            DB_HOST: postgres
            KAFKA_BROKERS: kafka:29092
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
        deploy:
            replicas: ${KAFKA_EXPRESS_WORKERS:-3}
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: sms-gateway-scheduler
        command: php artisan schedule:work
        restart: unless-stopped
        init: true
        env_file:
            - .env
        environment:
            DB_HOST: postgres
            KAFKA_BROKERS: kafka:29092
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy

    sms-normal-worker:
        profiles:
            - normal
        build:
            context: .
            dockerfile: Dockerfile
        command: php artisan kafka:consume-normal
        restart: unless-stopped
        init: true
        env_file:
            - .env
        environment:
            DB_HOST: postgres
            KAFKA_BROKERS: kafka:29092
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
        deploy:
            replicas: ${KAFKA_NORMAL_WORKERS:-3}
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy

volumes:
    postgres-data:
    kafka-data:
