services:
    postgres:
        image: postgres:17-alpine
        container_name: sms-gateway-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-sms_gateway}
            POSTGRES_USER: ${DB_USERNAME:-sms_gateway}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data

    kafka:
        image: apache/kafka:3.9.1
        container_name: sms-gateway-kafka
        restart: unless-stopped
        ports:
            - "${KAFKA_PORT:-9092}:9092"
        environment:
            # for first test i used just one node, i will change it and other config that needed.
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093

            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # i make a kafka init in future
            KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-3} # i change partitions structure in future

volumes:
    postgres-data:
